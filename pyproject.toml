[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "saathi-agent"
version = "0.1.0"
description = "Your own AI companion - self-hosted, on your own server, for $0."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Bhupendra Singh" }]
dependencies = [
  "feedparser==6.0.12",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
markets = ["yfinance==1.1.0", "pandas==3.0.1"]
youtube = ["yt-dlp==2026.3.17"]
dev = [
  "mypy==1.19.1",
  "pytest==9.0.2",
  "ruff==0.15.8",
  "types-PyYAML==6.0.12.20250915",
]

[project.scripts]
saathi = "saathi.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/saathi"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["saathi"]
mypy_path = "src"
warn_unused_ignores = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
